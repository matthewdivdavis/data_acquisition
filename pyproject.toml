[project]
name = "data-acquisition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matthew", email = "davismatthewrocks@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
data-acquisition = "data_acquisition:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
